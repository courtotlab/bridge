[project]
name = "bridge-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-multipart",
    "pandas",
    "openpyxl",
    "requests>=2.31",
    "httpx>=0.27",
    "openai>=1.30",
    "anthropic>=0.25",
    "llm-ontology-mapper",
]

[tool.uv.sources]
llm-ontology-mapper = { path = "../../llm-ontology-mapper", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
